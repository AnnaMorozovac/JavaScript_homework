<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Практична робота 3</title>
</head>
<body>

<h2>Методи виведення інформації в JavaScript</h2>
<div id="output"></div>

<script>
    document.write("Текст, виведений через document.write()<br>");

    alert("Повідомлення через alert");

    console.log("Це повідомлення в консолі");

    // innerHTML
    document.getElementById("output").innerHTML = "<b>Це жирний текст через InnerHTML</b>";
</script>
</body>
</html>

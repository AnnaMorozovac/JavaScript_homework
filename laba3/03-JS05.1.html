<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Практична робота 3</title>
</head>
<body>

<p id="text">Привіт, світе!</p>
<button onclick="removeLastChar()">Видалити останній символ</button>

<script>
    function removeLastChar() {
        let p = document.getElementById("text");
        p.textContent = p.textContent.slice(0, -1);
    }
</script>
</body>
</html>

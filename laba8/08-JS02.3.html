<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Завдання 2.3 – Реакція на подію</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        h1 {color: #FF00FF;}
        #k1 {
            position: absolute;
            left: 50px;
            top: 200px;
            width: 300px;
            height: 100px;
            background-color: blue;
        }
        #k2 {
            position: relative;
            left: 50px;
            top: 25px;
            width: 200px;
            height: 50px;
            background-color: yellow;
        }
    </style>
</head>
<body id="B" onclick="rodEl(event)" style="height:600px; background-color:#AAAAAA">
<h1 id="HH">КОЛІР</h1>
<div id="k1">
    <div id="k2"></div>
</div>

<script>
    let flag = 0;

    function rodEl(evt) {
        var e = evt || window.event;
        var elem = e.target || e.srcElement;
        var id1 = elem.id;
        var z1 = document.getElementById(id1);

        switch (id1) {
            case "k1":
                var z = z1.style.backgroundColor;
                if (z !== "red") z = "red";
                else z = "green";
                z1.style.backgroundColor = z;
                break;

            case "k2":
                var z = z1.style.backgroundColor;
                if (z !== "rgb(0, 255, 255)") {z = "rgb(0, 255, 255)";}
                else {z = "rgb(0, 255, 0)";}
                z1.style.backgroundColor = z;
                break;

            case "B":
                var z = z1.style.backgroundColor;
                if (z !== "rgb(190, 190, 190)") {z = "rgb(190, 190, 190)";}
                else {z = "rgb(0, 190, 190)";}
                z1.style.backgroundColor = z;
                break;

            case "HH":
                if (flag === 0) {
                    document.getElementById(id1).style.color = "rgb(170,0,170)";
                    flag = 1;
                } else {
                    document.getElementById(id1).style.color = "rgb(0,255,170)";
                    flag = 0;
                }
                break;
        }
    }
</script>
</body>
</html>

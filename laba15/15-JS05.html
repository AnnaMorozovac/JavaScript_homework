<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Практична робота 15 (Завдання 5–9)</title>
</head>
<body>
<h2>Практична робота 15 (Завдання 5–9)</h2>
<p>Відкрий консоль браузера (F12 → Console), щоб побачити результати.</p>

<script>
    // ===== Завдання 5 =====
    let arr = ["Tom", "Sam", "Ray", "Bob"];
    let [x, y, , z] = arr;
    console.log("Завдання 5:");
    console.log(x); // "Tom"
    console.log(y); // "Sam"
    console.log(z); // "Bob");

    // ===== Завдання 6 =====
    let data = {
        names: ["Sam", "Tom", "Ray", "Bob"],
        ages: [20, 24, 22, 26],
    };
    let {names: [, name2, , name4], ages: [, age2, , age4]} = data;
    console.log("Завдання 6:");
    console.log(name2); // "Tom"
    console.log(age2);  // 24
    console.log(name4); // "Bob"
    console.log(age4);  // 26

    // ===== Завдання 7 =====
    function mul(...args) {
        let nums = args.filter(a => typeof a === "number" && !isNaN(a));
        if (nums.length === 0) return 0;
        return nums.reduce((acc, val) => acc * val, 1);
    }
    console.log("Завдання 7:");
    console.log(mul(1, "str", 2, 3, true)); // 6
    console.log(mul(null, "str", false, true)); // 0

    // ===== Завдання 8 =====
    let server = {
        data: 0,
        convertToString: function (callback) {
            callback(() => this.data + "");
        }
    };
    let client = {
        server: server,
        result: "",
        calc: function (data) {
            this.server.data = data;
            this.server.convertToString(this.notification());
        },
        notification: function () {
            return (callback) => {
                this.result = callback();
            };
        }
    };
    client.calc(123);
    console.log("Завдання 8:");
    console.log(client.result); // "123"
    console.log(typeof client.result); // "string"

    // ===== Завдання 9 =====
    function mapBuilder(keysArray, valuesArray) {
        let map = new Map();
        for (let i = 0; i < keysArray.length; i++) {
            map.set(keysArray[i], valuesArray[i]);
        }
        return map;
    }
    let keys = [1, 2, 3, 4];
    let values = ["div", "span", "b", "i"];
    let map = mapBuilder(keys, values);
    console.log("Завдання 9:");
    console.log(map.size);   // 4
    console.log(map.get(2)); // "span"
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>

<p id="size"></p>

<script>
    window.onresize = function() {
        document.getElementById("size").textContent =
            "Ширина: " + window.innerWidth + " — Висота: " + window.innerHeight;
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>

<select id="list">
    <option>BMW</option>
    <option>Audi</option>
    <option>Ford</option>
    <option>Toyota</option>
</select>

<button onclick="removeItem()">Видалити вибір</button>

<script>
    function removeItem() {
        let list = document.getElementById("list");
        list.remove(list.selectedIndex);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>

<button id="btn">Кнопка</button>
<p id="msg"></p>

<script>
    let btn = document.getElementById("btn");
    let msg = document.getElementById("msg");

    btn.onclick = () => msg.textContent = "Натиснули!";
    btn.onmouseover = () => msg.textContent = "Мишка на мені!";
    btn.onmouseout = () => msg.textContent = "Мишка не на мені!";
</script>

</body>
</html>

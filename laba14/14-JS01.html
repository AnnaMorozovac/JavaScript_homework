<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота 14</title>
    <script>
        // 1. Перевірка першої літери на верхній регістр
        function upperCase(str) {
            if (/^[A-Z]/.test(str)) {
                console.log("String's starts with uppercase character");
            } else {
                console.log("String's not starts with uppercase character");
            }
        }

        // 2. Перевірка на email (проста)
        function checkEmailSimple(email) {
            let re = /\S+@\S+\.\S+/;
            console.log(re.test(email));
        }

        // 3. Регулярний вираз: d + b+ + d (з урахуванням регістру)
        function findPattern(str) {
            let re = /d(b+)(d)/gi;
            let result = str.match(re);
            console.log(result);
        }

        // 4. Міняти місцями дві підстрічки
        function swapSubstrings(str) {
            let re = /^(\w+)\s+(\w+)$/;
            let result = str.replace(re, "$2, $1");
            console.log(result);
        }

        // 5. Валідація номера банківської карти
        function validateCard(num) {
            let re = /^\d{4}-\d{4}-\d{4}-\d{4}$/;
            console.log(re.test(num));
        }

        // 6. Перевірка email за вимогами
        function checkEmailStrict(email) {
            let re = /^[A-Za-z0-9]+([_-]?[A-Za-z0-9]+)*@[A-Za-z0-9]+(\.[A-Za-z]{2,})+$/;
            if (re.test(email)) {
                console.log("Email is correct!");
            } else {
                console.log("Email is not correct!");
            }
        }

        // 7. Перевірка логіна
        function checkLogin(login) {
            let re = /^[A-Za-z][A-Za-z0-9]{1,9}$/;
            let numbers = login.match(/\d+(\.\d+)?/g);
            console.log(re.test(login));
            if (numbers) console.log(numbers.join(", "));
        }
    </script>
</head>
<body>
<h2>Лабораторна робота 14</h2>
<p>Результати дивитися у консолі браузера (F12 → Console).</p>
<script>

    // 1
    upperCase('regexp');
    upperCase('RegExp');

    // 2
    checkEmailSimple("Qmail2@gmail.com");

    // 3
    findPattern("cdbBdbsbz");

    // 4
    swapSubstrings("Java Script");

    // 5
    validateCard("9999-9999-9999-9999");

    // 6
    checkEmailStrict('my_mail@gmail.com');
    checkEmailStrict('#my_mail@gmail.com');
    checkEmailStrict('my_ma--il@gmail.com');

    // 7
    checkLogin('ee1.1ret3');
    checkLogin('ee1*1ret3');
</script>
</body>
</html>
